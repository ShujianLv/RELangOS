<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="RELang OS — 面向智能代理与多端协同的操作系统。专有软件，支持评估与合作授权。" />
  <title>RELang OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #e8eef6;
      --muted: #8b9bb0;
      --faint: #5c6b7e;
      --line: rgba(232, 238, 246, 0.09);
      --line-strong: rgba(232, 238, 246, 0.16);
      --sea: #6eb6e0;
      --moss: #8fbfa0;
      --sand: #d4b483;
      --bg: #0a0e14;
      --bg-elev: #121a24;
      --max: 70rem;
      --font: "Noto Sans SC", "DM Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      font-size: 1rem;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--sea); text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 0.15em; }
    img, svg { max-width: 100%; display: block; }

    .wrap {
      width: min(100% - 2rem, var(--max));
      margin-inline: auto;
    }

    /* Header */
    .bar {
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(16px);
      background: rgba(10, 14, 20, 0.82);
      border-bottom: 1px solid var(--line);
    }
    .bar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 3.5rem;
      padding-block: 0.65rem;
    }
    .brand {
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-decoration: none;
      flex-shrink: 0;
    }
    .brand:hover { color: var(--sea); text-decoration: none; }

    .bar-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .lang {
      display: inline-flex;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .lang button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.35rem 0.65rem;
      cursor: pointer;
    }
    .lang button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--bg);
    }
    .menu-btn {
      display: none;
      appearance: none;
      border: 1px solid var(--line-strong);
      background: transparent;
      color: var(--ink);
      border-radius: 8px;
      width: 2.5rem;
      height: 2.5rem;
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
    }
    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 1.1rem;
      font-size: 0.88rem;
    }
    .nav a { color: var(--muted); }
    .nav a:hover { color: var(--ink); text-decoration: none; }

    @media (max-width: 860px) {
      .menu-btn { display: inline-flex; align-items: center; justify-content: center; }
      .nav {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        top: 100%;
        flex-direction: column;
        gap: 0;
        padding: 0.5rem 1rem 1rem;
        background: rgba(10, 14, 20, 0.96);
        border-bottom: 1px solid var(--line);
      }
      .nav.open { display: flex; }
      .nav a {
        padding: 0.7rem 0.25rem;
        border-bottom: 1px solid var(--line);
      }
      .bar { position: sticky; }
      .bar-inner { position: relative; }
    }

    /* Hero — full viewport; copy locked left, media weighted right */
    .hero {
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
      min-height: calc(100svh - 3.5rem);
      display: flex;
      align-items: center;
      padding: clamp(3.5rem, 9vw, 6rem) 0;
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .hero-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 92% 42%;
      transform: scale(1.06);
      transform-origin: 85% center;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(
          90deg,
          rgba(10, 14, 20, 0.97) 0%,
          rgba(10, 14, 20, 0.94) 26%,
          rgba(10, 14, 20, 0.72) 46%,
          rgba(10, 14, 20, 0.28) 68%,
          rgba(10, 14, 20, 0.42) 100%
        ),
        linear-gradient(180deg, rgba(10, 14, 20, 0.4) 0%, transparent 30%, rgba(10, 14, 20, 0.58) 100%);
      pointer-events: none;
    }
    .hero-shell {
      position: relative;
      z-index: 2;
      width: min(100% - 2rem, var(--max));
      margin-inline: auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
    }
    @media (min-width: 900px) {
      .hero-shell {
        grid-template-columns: minmax(0, 0.56fr) minmax(0, 0.44fr);
        align-items: center;
      }
    }
    .hero-inner {
      position: relative;
      z-index: 2;
      max-width: 36rem;
      justify-self: start;
      text-align: left;
    }
    .hero-brand {
      margin: 0 0 1.1rem;
      font-size: clamp(2.15rem, 5.2vw, 3.35rem);
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.05;
      color: var(--ink);
      text-shadow: 0 2px 28px rgba(10, 14, 20, 0.55);
    }
    .hero-brand .os {
      color: var(--sea);
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .hero h1 {
      margin: 0 0 1rem;
      font-size: clamp(1.55rem, 3.2vw, 2.05rem);
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: 0.01em;
      word-break: keep-all;
      text-shadow: 0 1px 24px rgba(10, 14, 20, 0.45);
      max-width: 18em;
    }
    .hero .lede {
      margin: 0 0 1.75rem;
      color: #b7c4d4;
      font-size: clamp(0.98rem, 1.6vw, 1.08rem);
      line-height: 1.75;
      max-width: 34rem;
    }
    .hero .lede em,
    .hero .lede strong { font-style: normal; color: var(--ink); font-weight: 600; }
    .hero .btn-ghost {
      background: rgba(10, 14, 20, 0.35);
      backdrop-filter: blur(8px);
      border-color: rgba(232, 238, 246, 0.28);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.65rem 1.15rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.3s var(--ease), background 0.2s, color 0.2s, border-color 0.2s;
    }
    .btn:hover { text-decoration: none; transform: translateY(-1px); }
    .btn-primary { background: var(--ink); color: var(--bg); }
    .btn-primary:hover { background: #fff; }
    .btn-ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line-strong);
    }
    .btn-ghost:hover { border-color: var(--muted); color: var(--sea); }

    /* Sections */
    .section {
      padding: clamp(2.75rem, 6vw, 4rem) 0;
      border-bottom: 1px solid var(--line);
    }
    .section.close { border-bottom: 0; padding-bottom: clamp(3.5rem, 7vw, 5rem); }
    .kicker {
      margin: 0 0 0.55rem;
      font-size: 0.72rem;
      font-weight: 650;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--sea);
    }
    .section h2 {
      margin: 0 0 0.85rem;
      font-size: clamp(1.3rem, 2.4vw, 1.6rem);
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: 0.01em;
      word-break: keep-all;
      max-width: 36rem;
    }
    .prose {
      margin: 0 0 1.1rem;
      color: var(--muted);
      max-width: 40rem;
      font-size: 0.98rem;
      line-height: 1.75;
    }
    .prose strong { color: var(--ink); font-weight: 600; }
    .note {
      margin: 1rem 0 0;
      color: var(--faint);
      font-size: 0.88rem;
      max-width: 40rem;
    }

    .grid-2 {
      display: grid;
      gap: 1.75rem;
    }
    @media (min-width: 900px) {
      .grid-2 { grid-template-columns: 1fr 1.05fr; gap: 2.5rem; align-items: start; }
    }

    .principles {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .principles li {
      display: grid;
      gap: 0.2rem 1rem;
      padding: 1rem 0;
      border-top: 1px solid var(--line);
    }
    @media (min-width: 560px) {
      .principles li { grid-template-columns: 2.5rem 1fr; }
    }
    .principles .num {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--faint);
      letter-spacing: 0.04em;
      padding-top: 0.15rem;
    }
    .principles h3 {
      margin: 0 0 0.25rem;
      font-size: 1rem;
      font-weight: 650;
    }
    .principles p {
      margin: 0;
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.65;
    }

    /* Architecture layers — stacked under diagram, then horizontal band */
    .arch-stage {
      margin-top: 1.35rem;
    }
    .arch-stage .visual {
      max-width: 52rem;
      margin-inline: auto;
    }
    .arch-stage .visual img {
      aspect-ratio: 16 / 10;
      object-fit: cover;
      object-position: center top;
    }
    .layers {
      display: grid;
      gap: 0.65rem;
      margin: 1.15rem 0 0;
      padding: 0;
      list-style: none;
    }
    @media (min-width: 720px) {
      .layers {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.55rem;
      }
    }
    @media (min-width: 1100px) {
      .layers {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
    }
    .layers li {
      background: var(--bg-elev);
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      padding: 0.85rem 0.9rem;
      min-height: 100%;
    }
    .layers strong {
      display: block;
      font-size: 0.88rem;
      font-weight: 650;
      margin-bottom: 0.25rem;
      color: var(--moss);
      line-height: 1.35;
    }
    .layers span {
      display: block;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.5;
    }
    .arch-notes {
      display: grid;
      gap: 1rem 2rem;
      margin-top: 1.5rem;
      padding-top: 1.35rem;
      border-top: 1px solid var(--line);
    }
    @media (min-width: 800px) {
      .arch-notes { grid-template-columns: 1fr 1fr; }
    }
    .arch-notes .prose {
      max-width: none;
      margin-bottom: 0;
    }
    .arch-notes .note {
      grid-column: 1 / -1;
      margin-top: 0;
      max-width: none;
    }

    .values {
      display: grid;
      gap: 1.25rem;
    }
    @media (min-width: 900px) {
      .values { grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
    }
    .values article {
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.2rem 1.2rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }
    .values h3 {
      margin: 0;
      font-size: 1.02rem;
      font-weight: 650;
    }
    .values .audience {
      margin: 0;
      color: var(--sea);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .values p {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.65;
    }
    .value-line {
      margin: 0.15rem 0 0 !important;
      padding-top: 0.7rem;
      border-top: 1px solid var(--line);
      color: var(--ink) !important;
      font-size: 0.84rem !important;
      line-height: 1.55 !important;
    }
    .why-highlight {
      margin-top: 1.5rem;
      padding: 1.35rem 1.35rem 1.4rem;
      border: 1px solid var(--line-strong);
      border-radius: 14px;
      background:
        linear-gradient(135deg, rgba(110, 182, 224, 0.08), transparent 55%),
        var(--bg-elev);
    }
    .why-highlight h3 {
      margin: 0 0 0.45rem;
      font-size: 1.08rem;
      font-weight: 650;
    }
    .why-highlight p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.7;
      max-width: 52rem;
    }
    .why-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: 0.95rem;
    }
    .why-tags span {
      display: inline-flex;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      border: 1px solid var(--line-strong);
      color: var(--sand);
      font-size: 0.78rem;
      font-weight: 600;
    }

    .feature {
      padding: 1.35rem 0;
      border-top: 1px solid var(--line);
    }
    .feature:first-of-type { border-top: 0; padding-top: 0.25rem; }
    .feature h3 {
      margin: 0 0 0.4rem;
      font-size: 1.05rem;
      font-weight: 650;
      word-break: keep-all;
    }
    .feature p {
      margin: 0;
      color: var(--muted);
      max-width: 42rem;
      font-size: 0.95rem;
      line-height: 1.7;
    }
    .meta {
      display: inline-block;
      margin-top: 0.55rem;
      font-size: 0.78rem;
      color: var(--sand);
    }

    .vert {
      margin-top: 1.5rem;
      padding-top: 1.35rem;
      border-top: 1px solid var(--line);
    }
    .vert h3 {
      margin: 0 0 0.35rem;
      font-size: 1.02rem;
      font-weight: 650;
    }
    .vert p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.65;
      max-width: 44rem;
    }
    .bound {
      margin-top: 0.5rem !important;
      color: var(--sand) !important;
      font-size: 0.88rem !important;
    }

    /* Text + media compositions */
    .split {
      display: grid;
      gap: 1.5rem;
      align-items: start;
      margin-top: 0.35rem;
    }
    @media (min-width: 900px) {
      .split {
        grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
        gap: 2.25rem;
        align-items: center;
      }
      .split.reverse {
        grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr);
      }
      .split.reverse > .split-media { order: -1; }
      .split.top { align-items: start; }
      .split.top > .split-media {
        position: sticky;
        top: 4.5rem;
      }
    }
    .split-copy .prose {
      max-width: none;
    }
    .split-copy .prose:last-child { margin-bottom: 0; }
    .split-copy .kicker { margin-top: 0; }
    .split-copy h2 { max-width: none; }

    .visual {
      margin: 0;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      background: var(--bg-elev);
    }
    .visual img {
      width: 100%;
      height: auto;
      display: block;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      object-position: center;
    }
    .visual figcaption {
      padding: 0.65rem 0.9rem 0.75rem;
      font-size: 0.78rem;
      color: var(--faint);
      line-height: 1.45;
      border-top: 1px solid var(--line);
    }

    .field-cards {
      display: grid;
      gap: 1.25rem;
      margin-top: 1.5rem;
    }
    @media (min-width: 700px) {
      .field-cards { grid-template-columns: 1fr 1fr; gap: 1.35rem; }
    }
    @media (min-width: 1100px) {
      .field-cards { grid-template-columns: repeat(3, 1fr); gap: 1.35rem; }
    }
    .field-card {
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .field-card .visual {
      border: 0;
      border-radius: 0;
      border-bottom: 1px solid var(--line);
    }
    .field-card .visual img {
      aspect-ratio: 16 / 11;
    }
    .field-card .visual figcaption { display: none; }
    .field-card .body {
      padding: 1.05rem 1.15rem 1.2rem;
      flex: 1;
    }
    .field-card h3 {
      margin: 0 0 0.35rem;
      font-size: 1.02rem;
      font-weight: 650;
    }
    .field-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.65;
    }
    .field-card .bound {
      margin-top: 0.65rem !important;
    }

    .caps-lead {
      margin-bottom: 0.25rem;
    }
    .caps-lead .feature {
      border-top: 0;
      padding-top: 0;
      padding-bottom: 0;
    }
    .feature-list {
      margin-top: 1.5rem;
      border-top: 1px solid var(--line);
    }
    .feature-list .feature:first-of-type {
      border-top: 0;
      padding-top: 1.15rem;
    }

    .cap-rows {
      display: grid;
      gap: 1.25rem;
      margin-top: 1.35rem;
    }
    .cap-row {
      display: grid;
      gap: 1rem;
      align-items: center;
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      padding: 0;
    }
    @media (min-width: 800px) {
      .cap-row {
        grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr);
        gap: 0;
        min-height: 11.5rem;
      }
      .cap-row:nth-child(even) {
        grid-template-columns: minmax(0, 1.08fr) minmax(0, 0.92fr);
      }
      .cap-row:nth-child(even) .cap-media { order: 2; }
    }
    .cap-media {
      margin: 0;
      border: 0;
      border-radius: 0;
      background: #0c1219;
      height: 100%;
    }
    .cap-media img {
      width: 100%;
      height: 100%;
      min-height: 10.5rem;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    .cap-media figcaption { display: none; }
    .cap-body {
      padding: 1.1rem 1.2rem 1.2rem;
    }
    .cap-body h3 {
      margin: 0 0 0.4rem;
      font-size: 1.05rem;
      font-weight: 650;
      word-break: keep-all;
    }
    .cap-body p {
      margin: 0;
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.65;
      max-width: none;
    }
    .cap-body .meta {
      margin-top: 0.6rem;
    }

    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin-top: 0.5rem;
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    table {
      width: 100%;
      min-width: 32rem;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th, td {
      text-align: left;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    tr:last-child td { border-bottom: 0; }
    th {
      color: var(--faint);
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: var(--bg-elev);
    }
    td { color: var(--muted); }
    td:first-child { color: var(--ink); font-weight: 500; white-space: nowrap; }
    td.hl { color: var(--sea); }

    .footnote {
      margin-top: 1.5rem;
      color: var(--faint);
      font-size: 0.85rem;
      max-width: 40rem;
      line-height: 1.6;
    }

    .access-flow {
      list-style: none;
      margin: 1.25rem 0 0;
      padding: 0;
      display: grid;
      gap: 0.75rem;
      counter-reset: access-step;
    }
    @media (min-width: 800px) {
      .access-flow {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.85rem;
      }
    }
    .access-flow li {
      counter-increment: access-step;
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.95rem 1rem 1.05rem;
    }
    .access-flow li::before {
      content: counter(access-step, decimal-leading-zero);
      display: block;
      margin-bottom: 0.35rem;
      color: var(--sea);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .access-flow strong {
      display: block;
      margin-bottom: 0.25rem;
      font-size: 0.95rem;
      font-weight: 650;
    }
    .access-flow span {
      color: var(--muted);

        "hero.title": "An OS built for agents and multi-device work",
        "hero.lede": "Devices are finishing jobs for people, handing work across screens, and recovering in the field. RELang OS makes <strong>agents, trusted permissions, and multi-device collaboration</strong> first-class OS primitives — for vertical devices and multi-device form factors.",

    const STORAGE_KEY = "relangos-lang";

    function detectLang() {
      const params = new URLSearchParams(location.search);
      const q = params.get("lang");
      if (q === "en" || q === "zh") return q;
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved === "en" || saved === "zh") return saved;
      } catch (_) {}
      const nav = (navigator.language || "zh").toLowerCase();
      return nav.startsWith("zh") ? "zh" : "en";
    }

    function applyLang(lang) {
      const dict = I18N[lang] || I18N.zh;
      document.documentElement.lang = lang === "en" ? "en" : "zh-Hans";
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (dict[key] != null) el.textContent = dict[key];
      });
      document.querySelectorAll("[data-i18n-html]").forEach((el) => {
        const key = el.getAttribute("data-i18n-html");
        if (dict[key] != null) el.innerHTML = dict[key];
      });
      document.querySelectorAll("[data-i18n-alt]").forEach((el) => {
        const key = el.getAttribute("data-i18n-alt");
        if (dict[key] != null) el.setAttribute("alt", dict[key]);
      });
      document.querySelectorAll("[data-i18n-aria]").forEach((el) => {
        const key = el.getAttribute("data-i18n-aria");
        if (dict[key] != null) el.setAttribute("aria-label", dict[key]);
      });
      document.title = lang === "en"
        ? "RELang OS — OS for agents and multi-device work"
        : "RELang OS — 面向智能代理与多端协同的操作系统";
      document.getElementById("lang-zh").setAttribute("aria-pressed", String(lang === "zh"));
      document.getElementById("lang-en").setAttribute("aria-pressed", String(lang === "en"));
      try { localStorage.setItem(STORAGE_KEY, lang); } catch (_) {}
      const url = new URL(location.href);
      url.searchParams.set("lang", lang);
      history.replaceState(null, "", url);
    }

    document.getElementById("lang-zh").addEventListener("click", () => applyLang("zh"));
    document.getElementById("lang-en").addEventListener("click", () => applyLang("en"));

    const menuBtn = document.getElementById("menu-btn");
    const nav = document.getElementById("site-nav");
    menuBtn.addEventListener("click", () => {
      const open = nav.classList.toggle("open");
      menuBtn.setAttribute("aria-expanded", String(open));
    });
    nav.querySelectorAll("a").forEach((a) => {
      a.addEventListener("click", () => {
        nav.classList.remove("open");
        menuBtn.setAttribute("aria-expanded", "false");
      });
    });

    applyLang(detectLang());
  </script>
